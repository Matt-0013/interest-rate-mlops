# ---------------------------------------------------------------------------
# Modelling configuration: features, splits, models, tracking and promotion.
# ---------------------------------------------------------------------------
features:
  # Lags are expressed in *observations* (months), not calendar days:
  # lag_k at origin t == value at t-(k-1), i.e. k steps before the forecast target.
  lags: [1, 2, 3, 6, 12]
  rolling_windows: [3, 6, 12]
  rolling_stats: [mean, std]
  diffs: [1, 12]
  # Need max(lags)+1 observations to build one feature row.
  min_observations: 13

split:
  strategy: chronological
  test_fraction: 0.2
  min_test_observations: 24

cv:
  # Expanding-window walk-forward validation on the training portion only.
  strategy: expanding_window
  n_splits: 5
  gap: 0

models:
  linear_regression:
    type: linear_regression
    params:
      fit_intercept: true
  random_forest:
    type: random_forest
    params:
      n_estimators: 300
      max_depth: 8
      min_samples_split: 5
      min_samples_leaf: 2
      random_state: 42
      n_jobs: -1
  xgboost:
    type: xgboost
    params:
      n_estimators: 400
      learning_rate: 0.05
      max_depth: 4
      subsample: 0.9
      colsample_bytree: 0.9
      min_child_weight: 1
      reg_lambda: 1.0
      objective: reg:squarederror
      tree_method: hist
      random_state: 42
      n_jobs: 4

selection:
  # Cross-validated score decides which candidate is registered; the held-out
  # test block is then reported as the final, unbiased estimate.
  primary_metric: cv_rmse
  secondary_metric: cv_mae
  minimize: true

mlflow:
  experiment_name: interest-rate-forecasting
  registered_model_name: interest_rate_forecaster
  artifact_path: model
  champion_alias: champion
  challenger_alias: challenger
  register_best_only: true
  # null -> Settings.mlflow_tracking_uri (env var MLFLOW_TRACKING_URI)
  tracking_uri: null

promotion:
  # Gate 1: absolute quality. A next-month fed-funds forecast with RMSE above
  # 0.75 pp is not useful enough to serve.
  max_test_rmse: 0.75
  # Gate 2: percentage error sanity (MAPE computed only where |y| >= 0.5 pp).
  max_mape: 25.0
  # Gate 3: stability of the walk-forward folds (std/mean of fold RMSE).
  # Rejects a candidate whose fold-to-fold error varies more than its own mean.
  # The folds deliberately span different rate regimes (1959-2005), so a ratio
  # around 0.8 is expected for a healthy model; the gate is not a variance target.
  max_cv_rmse_std_ratio: 1.0
  # Gate 4: must beat the incumbent champion by at least this much.
  min_rmse_improvement_pct: 2.0
  # When no champion exists, the first candidate only has to pass gates 1-3.
  bootstrap_when_no_champion: true
