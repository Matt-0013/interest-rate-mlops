[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "interest-rate-mlops"
version = "0.1.0"
description = "End-to-end MLOps platform for forecasting the US effective federal funds rate"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Interest Rate MLOps" }]
dynamic = ["dependencies"]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-cov==6.0.0", "httpx==0.27.2", "ruff==0.7.4"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Quality tooling
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "api", "tests", "scripts", "airflow"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
  "E501",   # long lines are handled by the formatter / line-length above
  "RET504", # explicit intermediate values read better in numerical code
  "B008",   # FastAPI Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S101", "B011"]
"scripts/*" = ["ARG", "T201"]
"airflow/dags/*" = ["ARG"]
"api/*" = ["ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["src", "."]
markers = [
  "integration: requires PostgreSQL / MLflow services (deselect with '-m \"not integration\"')",
  "slow: slower end-to-end pipeline checks",
]
filterwarnings = [
  "ignore::DeprecationWarning:mlflow.*",
  "ignore::UserWarning:evidently.*",
]

[tool.coverage.run]
source = ["src", "api"]
omit = ["*/tests/*"]
