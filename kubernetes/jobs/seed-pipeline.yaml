# ---------------------------------------------------------------------------
# One-shot pipeline job.
#
# The API serves the MLflow ``champion`` alias and the persisted feature matrix,
# so an empty cluster needs one pipeline run first. This job copies the raw CSV
# from the ``raw-dataset`` ConfigMap into the shared data volume (created from
# data/raw/.../index.csv by deploy.sh), applies migrations, then runs the four
# pipeline stages against the in-cluster MLflow and PostgreSQL.
#
# Re-running is safe: ingestion overwrites the panel, training registers a new
# version, promotion gates decide whether the alias moves, monitoring refreshes
# the drift status.
# ---------------------------------------------------------------------------
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-pipeline
  namespace: mlops
  labels:
    app.kubernetes.io/name: seed-pipeline
    app.kubernetes.io/part-of: interest-rate-mlops
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed-pipeline
    spec:
      restartPolicy: Never
      # The namespace holds Services named api, mlflow, postgres, prometheus and
      # grafana, so Kubernetes injects link variables such as
      # API_PORT=tcp://<cluster-ip>:8000 into every pod here. Settings reads
      # API_PORT as an integer, so those injected values break startup.
      enableServiceLinks: false
      initContainers:
        - name: wait-for-dependencies
          image: interest-rate-api:local
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              import socket, sys, time
              for host, port in [("postgres", 5432), ("mlflow", 5000)]:
                  for _ in range(60):
                      try:
                          socket.create_connection((host, port), 2).close()
                          break
                      except OSError:
                          time.sleep(2)
                  else:
                      sys.exit(f"{host}:{port} not reachable")
              sys.exit(0)
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: pipeline
          image: interest-rate-api:local
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p data/raw/federal_reserve_interest_rates
              cp /seed/index.csv data/raw/federal_reserve_interest_rates/index.csv
              alembic upgrade head
              python scripts/run_pipeline.py --stage all
          envFrom:
            - configMapRef: { name: api-config }
            - secretRef: { name: postgres-credentials }
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: reports
              mountPath: /app/reports
            - name: seed
              mountPath: /seed
              readOnly: true
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { cpu: "2", memory: 2Gi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlops-data
        - name: reports
          persistentVolumeClaim:
            claimName: mlops-reports
        - name: seed
          configMap:
            name: raw-dataset
