apiVersion: v1
kind: Namespace
metadata:
  name: mlops
  labels:
    app.kubernetes.io/part-of: interest-rate-mlops
---
# The single owner of the namespace resource quota. Terraform deliberately does
# not declare it (see terraform/main.tf) so the kubectl-only deploy path keeps
# the guard rail without any tool racing another over the same object.
# Dev-only defaults: the quota is sized for a 6 GB minikube VM.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: mlops-quota
  namespace: mlops
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 6Gi
    limits.cpu: "8"
    limits.memory: 10Gi
    persistentvolumeclaims: "6"
