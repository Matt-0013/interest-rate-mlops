apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: mlops
  labels:
    app.kubernetes.io/name: api
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  # In-cluster service names, never localhost.
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: interest_rate_forecaster
  MODEL_ALIAS: champion
  MODEL_CACHE_TTL_SECONDS: "300"
  MLOPS_PROJECT_ROOT: /app
  ENABLE_DB_PERSISTENCE: "true"
  ENABLE_DVC: "false"
  DATABASE_POOL_SIZE: "5"
