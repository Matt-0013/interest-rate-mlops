# Persistent storage for stateful components. One claim per concern so a
# component can be reset without touching the others.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mlops-postgres
  namespace: mlops
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
