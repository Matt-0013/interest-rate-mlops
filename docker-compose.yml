# ---------------------------------------------------------------------------
# Local stack for the interest-rate MLOps platform.
#
# Profiles let a small machine run only what it needs:
#   docker compose --profile core up -d              # postgres + mlflow + api
#   docker compose --profile observability up -d     # + prometheus + grafana
#   docker compose --profile orchestration up -d     # postgres + mlflow + airflow
#   docker compose --profile "*" up -d               # everything
#
# Credentials come from .env (copy .env.example). Nothing secret is baked into
# an image; services talk to each other by Compose service name.
# ---------------------------------------------------------------------------
name: interest-rate-mlops

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_local_password}@postgres:5432/${POSTGRES_DB:-mlops}
  DATABASE_POOL_SIZE: "5"
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: ${MODEL_NAME:-interest_rate_forecaster}
  MODEL_ALIAS: ${MODEL_ALIAS:-champion}
  MODEL_CACHE_TTL_SECONDS: ${MODEL_CACHE_TTL_SECONDS:-300}
  MLOPS_PROJECT_ROOT: /app
  ENABLE_DVC: "false"

x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__LOAD_EXAMPLES: "false"
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_local_password}@postgres:5432/airflow
  AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
  AIRFLOW__LOGGING__LOGGING_LEVEL: INFO
  # Pipeline tasks use the same configuration as the API.
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-mlops}:${POSTGRES_PASSWORD:-mlops_local_password}@postgres:5432/${POSTGRES_DB:-mlops}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MODEL_NAME: ${MODEL_NAME:-interest_rate_forecaster}
  MODEL_ALIAS: ${MODEL_ALIAS:-champion}
  MLOPS_PROJECT_ROOT: /opt/airflow/project
  ENABLE_DVC: "false"
  INGESTION_SCHEDULE: ${INGESTION_SCHEDULE:-}
  TRAINING_SCHEDULE: ${TRAINING_SCHEDULE:-}
  MONITORING_SCHEDULE: ${MONITORING_SCHEDULE:-@weekly}

services:
  postgres:
    image: postgres:16.4-alpine
    profiles: ["core", "observability", "orchestration"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mlops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlops_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-mlops}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mlops} -d ${POSTGRES_DB:-mlops}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  mlflow:
    image: interest-rate-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["core", "observability", "orchestration"]
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri ${MLFLOW_BACKEND_STORE_URI:-postgresql://mlops:mlops_local_password@postgres:5432/mlflow}
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
    environment:
      MLFLOW_SERVER_DISABLE_TELEMETRY: "true"
    volumes:
      - mlflow-artifacts:/mlflow/artifacts
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health', timeout=3).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  api:
    image: interest-rate-api:local
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    profiles: ["core", "observability"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment:
      <<: *app-env
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP:-false}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s
    restart: unless-stopped

  airflow-init:
    <<: &airflow-common
      image: interest-rate-airflow:local
      build:
        context: .
        dockerfile: docker/airflow.Dockerfile
      profiles: ["orchestration"]
      environment:
        <<: *airflow-env
      volumes:
        - ./airflow/dags:/opt/airflow/dags
        - ./data:/opt/airflow/project/data
        - ./reports:/opt/airflow/project/reports
        - airflow-logs:/opt/airflow/logs
      depends_on:
        postgres:
          condition: service_healthy
        mlflow:
          condition: service_healthy
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username ${AIRFLOW_ADMIN_USER:-admin}
                 --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
                 --firstname Admin --lastname User --role Admin
                 --email admin@example.com || true)"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver --port 8080
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  mlflow-artifacts:
  prometheus-data:
  grafana-data:
  airflow-logs:
