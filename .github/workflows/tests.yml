name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Validate configuration files
        run: python scripts/check_configs.py

  tests:
    name: Unit, API and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16.4
        env:
          POSTGRES_USER: mlops
          POSTGRES_PASSWORD: mlops_local_password
          POSTGRES_DB: mlops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlops -d mlops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: ci
      LOG_FORMAT: console
      ENABLE_DB_PERSISTENCE: "false"
      ENABLE_DVC: "false"
      # Exercises the PostgreSQL integration test against the service above.
      TEST_DATABASE_URL: postgresql+psycopg://mlops:mlops_local_password@localhost:5432/mlops_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: Run the test suite
        run: pytest tests -q -p no:warnings

      - name: Alembic migrations apply to PostgreSQL
        run: |
          DATABASE_URL="${TEST_DATABASE_URL}" alembic upgrade head
          DATABASE_URL="${TEST_DATABASE_URL}" alembic downgrade base

  api-contract:
    name: API contract smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: ci
      LOG_FORMAT: console
      ENABLE_DB_PERSISTENCE: "false"
      ENABLE_DVC: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e . --no-deps

      - name: OpenAPI schema is generated
        run: |
          python - <<'PY'
          from api.main import create_app
          from interest_rate_mlops.config import Settings

          app = create_app(Settings(app_env="ci", enable_db_persistence=False, enable_dvc=False))
          schema = app.openapi()
          paths = set(schema["paths"])
          required = {
              "/health",
              "/model/info",
              "/predict",
              "/predictions",
              "/metrics",
              "/drift/status",
              "/graphql",
          }
          missing = required - paths
          assert not missing, f"missing endpoints in OpenAPI schema: {sorted(missing)}"
          print(f"{len(paths)} paths, {len(schema.get('components', {}).get('schemas', {}))} schemas")
          PY
